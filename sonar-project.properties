sonar.projectKey=preifma-api-v2
sonar.projectName=PREIFMA - API
sonar.host.url=https://sedimentologic-crescentlike-tijuana.ngrok-free.dev
sonar.tests=spec
sonar.sources=app
sonar.exclusions=vendor/**,tmp/**,log/**,coverage/**,spec/**,**/views/**

sonar.ruby.coverage.reportPaths=coverage/coverage.json


# API Ruby — não analisar linguagens que não existem no projeto
sonar.javascript.file.suffixes=.none
sonar.typescript.file.suffixes=.none
sonar.html.file.suffixes=.none
sonar.css.file.suffixes=.none

# ngrok: evitar timeout em downloads lentos (fallback)
sonar.scanner.socketTimeout=300
sonar.plugins.download.timeout=600